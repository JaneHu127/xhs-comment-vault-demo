  <g transform="translate(150 940)">
    <circle cx="43" cy="0" r="43" fill="#e93750"/>
    <path d="m31-20 34 20-34 20z" fill="#fff"/>
    <text x="112" y="10" fill="#5f585d" font-family="Microsoft YaHei, sans-serif" font-size="26">点击播放 · 02:11</text>
